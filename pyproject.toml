[project]
name = "microformats-parser-website"
version = "1.0.0"
description = "A web interface for parsing microformats using mf2py"
readme = "README.md"
license = "CC0-1.0"
requires-python = "==3.14.3"
dependencies = [
    "flask==3.1.3",
    "gunicorn==25.1.0",
    "lxml==6.0.2",
    "mf2py==2.0.1",
    "mf2util==0.5.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "ty>=0.0.20",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ty.environment]
extra-paths = ["./stubs"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
invalid-argument-type = "error"
